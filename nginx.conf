user root;
worker_processes 1;
daemon off;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/nginx-access.log;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    server {
        listen 9000;
        server_name _;
        root /code;
        index index.html index.htm;

        # --- 301 redirects (SEO migration safety: old URLs -> new equivalents) ---
        location = /our-approach/ { return 301 /approach/; }
        location = /our-method/ { return 301 /approach/how-we-assess-leadership/; }
        location = /our-edge/ { return 301 /approach/executive-search-psychology/; }
        location = /solutions/ { return 301 /services/; }
        location = /blog/ { return 301 /insights/; }
        location = /leadership-briefings/ { return 301 /insights/; }
        location = /services/judgment-search/ { return 301 /services/executive-search/; }
        location = /services/succession/ { return 301 /services/ceo-board-succession/; }
        location = /services/interim-leaders/ { return 301 /services/interim-executive-leadership/; }
        location = /the-roster/ { return 301 /about/; }
        location = /history/ { return 301 /about/; }
        location = /team/ { return 301 /about/; }
        location = /careers/ { return 301 /about/; }
        location = /faq/ { return 301 /contact/; }
        location = /price-plan/ { return 301 /; }
        location = /sample-page/ { return 301 /; }
        location = /refund_returns/ { return 301 /; }
        location ^~ /2025/ { return 301 /insights/; }

        location / {
            try_files $uri $uri/ $uri.html @slashed;
        }
        location @slashed {
            rewrite ^(.+)/$ $1.html last;
        }
        error_page 404 /404.html;
    }
}
